{% extends "base.html" %}{% block title %}Create Account — TRR NEWS{% endblock %}{% block body_class %}auth-page{% endblock %}
{% block content %}
<section class="auth-shell" aria-labelledby="auth-title"><div class="authbox signup-box">
  <a class="auth-brand" href="{{ url_for('main.home') }}" aria-label="TRR NEWS home"><span>TRR</span> <b>NEWS</b></a>
  <h1 id="auth-title">Create account</h1><p class="auth-subtitle">Join the TRR NEWS community.</p>
  <form method="post" class="auth-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Full name<input name="name" autocomplete="name" required maxlength="120" placeholder="Full name"></label>
    <label>Email<input name="email" type="email" autocomplete="email" required maxlength="255" placeholder="Email"></label>
    <label>Password<input name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="Password (8+ characters)"></label>
    <button class="btn auth-submit" type="submit"><span aria-hidden="true">＋</span> Create Account</button>
  </form>
  <div class="auth-divider"><span>or</span></div>
  <a class="auth-secondary" href="{{ url_for('auth.login') }}">Already have an account? Login</a>
</div></section>
{% endblock %}
