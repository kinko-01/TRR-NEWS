{% extends "admin/base.html" %}{% block title %}Users — TRR NEWS{% endblock %}{% block admincontent %}<h1>Users</h1><div class="panel tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Change</th></tr></thead><tbody>{% for u in users %}<tr><td>{{ u.name }}</td><td>{{ u.email }}</td><td>{{ u.role }}</td><td>{% if u.id == current_user.id %}<span>Current administrator</span>{% else %}<form method="post" action="{{ url_for('admin.change_role',user_id=u.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><select name="role" aria-label="Role for {{ u.name }}">{% for role in ('reader','journalist','editor','admin') %}<option value="{{ role }}" {% if u.role == role %}selected{% endif %}>{{ role }}</option>{% endfor %}</select><button type="submit">Save</button></form>{% endif %}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
