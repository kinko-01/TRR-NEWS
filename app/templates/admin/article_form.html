{% extends "admin/base.html" %}{% block title %}{{ 'Edit Article' if article else 'Create Article' }} — TRR NEWS{% endblock %}{% block admincontent %}<div class="sectionhead"><h1>{{ 'Edit Article' if article else 'Create Article' }}</h1></div><form class="panel editorform" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Headline<input name="title" required maxlength="250" placeholder="Headline" value="{{ article.title if article else '' }}"></label><label>Excerpt<textarea name="excerpt" rows="3" maxlength="2000" placeholder="Short excerpt">{{ article.excerpt if article else '' }}</textarea></label><label>Category<select name="category_id" required>{% for c in categories %}<option value="{{ c.id }}" {% if article and article.category_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></label><label>Featured image<input type="file" name="featured_image" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp">{% if article and article.featured_image %}<small>Current image: {{ article.featured_image }}</small>{% endif %}</label><label>Article body<textarea name="content" rows="18" required maxlength="100000" placeholder="Article body. Basic HTML is supported.">{{ article.content if article else '' }}</textarea></label><label>Status<select name="status"><option value="draft" {% if not article or article.status=='draft' %}selected{% endif %}>Draft</option><option value="published" {% if article and article.status=='published' %}selected{% endif %}>Published</option></select></label><label class="check"><input type="checkbox" name="is_featured" {% if article and article.is_featured %}checked{% endif %}> Featured story</label><label class="check"><input type="checkbox" name="is_breaking" {% if article and article.is_breaking %}checked{% endif %}> Breaking news</label><button class="btn" type="submit">Save Article</button></form>{% endblock %}
