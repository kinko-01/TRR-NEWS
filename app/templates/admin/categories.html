{% extends "admin/base.html" %}{% block title %}Categories — TRR NEWS{% endblock %}{% block admincontent %}<h1>Categories</h1><form class="panel inlineform" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="name" required maxlength="80" placeholder="New category"><input name="description" maxlength="500" placeholder="Description (optional)"><button class="btn" type="submit">Add</button></form><div class="panel">{% for c in categories %}<div class="listrow"><div><b>{{ c.name }}</b>{% if c.description %}<small>{{ c.description }}</small>{% endif %}</div><span>{{ c.slug }}</span></div>{% else %}<p>No categories.</p>{% endfor %}</div>{% endblock %}
